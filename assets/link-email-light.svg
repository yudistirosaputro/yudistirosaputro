<svg xmlns="http://www.w3.org/2000/svg" width="280" height="76" viewBox="0 0 280 76" role="img" aria-labelledby="t"><title id="t">Email</title>
<style>
@font-face{font-family:"Libre Franklin";font-weight:600;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
.ui{font-family:"Libre Franklin", "Franklin Gothic", ui-sans-serif, system-ui, sans-serif;font-weight:600;font-style:normal}
text{text-rendering:geometricPrecision}
.rise{animation:rise 1.2s cubic-bezier(.32,.72,0,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.drift{transform-box:fill-box;transform-origin:center;animation:drift 18s cubic-bezier(.45,.05,.25,1) infinite alternate}
@keyframes drift{to{transform:translate(var(--dx),var(--dy)) scale(1.08)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s cubic-bezier(.32,.72,0,1) infinite}
@keyframes pulse{from{opacity:.6;transform:scale(1)}to{opacity:0;transform:scale(3.2)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
