<svg xmlns="http://www.w3.org/2000/svg" width="320" height="262" viewBox="0 0 320 262" role="img" aria-labelledby="t"><title id="t">SplashWallpaper: Modular wallpaper gallery: a staggered Compose grid, Hilt and build-logic plugins.</title>
<style>
