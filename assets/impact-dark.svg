" fill="#f1f6fa" fill-opacity="0.66">User engagement,</text><text x="150" y="300" class="text" font-size="13" fill="#f1f6fa" fill-opacity="0.66">lifted in production</text></g><rect x="14.5" y="12.5" width="291" height="317" rx="21.5" fill="none" stroke="url(#rim)"/>
