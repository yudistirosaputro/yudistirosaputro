<svg xmlns="http://www.w3.org/2000/svg" width="320" height="342" viewBox="0 0 320 342" role="img" aria-labelledby="t"><title id="t">Impact: 7+ years, 30% faster builds, 20% more engagement</title>
<style>
@font-face{font-family:"Libre Franklin";font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
.display{font-family:"Libre Franklin", "Franklin Gothic", ui-sans-serif, system-ui, sans-serif;font-weight:700;font-style:normal}
@font-face{font-family:"Geist Mono";font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
.mono5{font-family:"Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;font-weight:500;font-style:normal}
@font-face{font-family:"Source Serif 4";font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
.text{font-family:"Source Serif 4", "Iowan Old Style", Georgia, serif;font-weight:400;font-style:normal}
text{text-rendering:geometricPrecision}
.rise{animation:rise 1.2s cubic-bezier(.32,.72,0,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.drift{transform-box:fill-box;transform-origin:center;animation:drift 18s cubic-bezier(.45,.05,.25,1) infinite alternate}
@keyframes drift{to{transform:translate(var(--dx),var(--dy)) scale(1.08)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s cubic-bezier(.32,.72,0,1) infinite}
@keyframes pulse{from{opacity:.6;transform:scale(1)}to{opacity:0;transform:scale(3.2)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
