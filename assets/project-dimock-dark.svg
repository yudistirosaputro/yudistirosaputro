<svg xmlns="http://www.w3.org/2000/svg" width="520" height="266" viewBox="0 0 520 266" role="img" aria-labelledby="t"><title id="t">dimock: Agent-native HTTP inspector and mock injector for Android. It captures OkHttp traffic on the device and lets a coding agent inject mocks to drive every UI state.</title>
<style>
@font-face{font-family:"Libre Franklin";font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
