acity="0.045" stroke="#ffffff" stroke-opacity="0.1"/><text x="234.486" y="214.96" text-anchor="middle" class="ui" font-size="11" fill="#f1f6fa" fill-opacity="0.66">Maven Central</text><rect x="361.356" y="194.5" width="118.144" height="33" rx="16.5" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.1"/><text x="376.856" y="215.3" class="ui" font-size="12" fill="#f1f6fa">Repository</text><circle cx="463" cy="211" r="13" fill="#ffffff" fill-opacity="0.081"/><path d="M459.4 214.6L466.6 207.4M461.74 207.4H466.6V212.26" fill="none" stroke="#f1f6fa" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="14.5" y="12.5" width="491" height="241" rx="21.5" fill="none" stroke="url(#rim)"/>
