<svg xmlns="http://www.w3.org/2000/svg" width="840" height="132" viewBox="0 0 840 132" role="img" aria-labelledby="t"><title id="t">“Clean code always looks like it was written by someone who cares.” — Robert C. Martin</title>
<style>
@font-face{font-family:"Source Serif 4";font-weight:400;font-style:italic;src:url(data:font/woff2;base64,) format("woff2")}
.italic{font-family:"Source Serif 4", "Iowan Old Style", Georgia, serif;font-weight:400;font-style:italic}
@font-face{font-family:"Geist Mono";font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
.mono5{font-family:"Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;font-weight:500;font-style:normal}
text{text-rendering:geometricPrecision}
.rise{animation:rise 1.2s cubic-bezier(.32,.72,0,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.drift{transform-box:fill-box;transform-origin:center;animation:drift 18s cubic-bezier(.45,.05,.25,1) infinite alternate}
@keyframes drift{to{transform:translate(var(--dx),var(--dy)) scale(1.08)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s cubic-bezier(.32,.72,0,1) infinite}
@keyframes pulse{from{opacity:.6;transform:scale(1)}to{opacity:0;transform:scale(3.2)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs></defs>
<g class="rise" style="animation-delay:0ms"><text x="420" y="64" text-anchor="middle" class="italic" font-size="21" fill="#f1f6fa" fill-opacity="0.66">“Clean code always looks like it was written by someone who cares.”</text></g><g class="rise" style="animation-delay:120ms"><text x="420" y="94" text-anchor="middle" class="mono5" font-size="9.5" fill="#f1f6fa" fill-opacity="0.42" style="letter-spacing:1.9px">— ROBERT C. MARTIN</text></g>
</svg>
