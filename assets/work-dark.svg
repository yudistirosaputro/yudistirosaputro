<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150" role="img" aria-labelledby="t"><title id="t">Things I&#x27;ve built lately.</title>
<style>
@font-face{font-family:"Libre Franklin";font-weight:700;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
.display{font-family:"Libre Franklin", "Franklin Gothic", ui-sans-serif, system-ui, sans-serif;font-weight:700;font-style:normal}
@font-face{font-family:"Source Serif 4";font-weight:400;font-style:italic;src:url(data:font/woff2;base64,) format("woff2")}
.italic{font-family:"Source Serif 4", "Iowan Old Style", Georgia, serif;font-weight:400;font-style:italic}
@font-face{font-family:"Geist Mono";font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
.mono5{font-family:"Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;font-weight:500;font-style:normal}
@font-face{font-family:"Source Serif 4";font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format("woff2")}
.text{font-family:"Source Serif 4", "Iowan Old Style", Georgia, serif;font-weight:400;font-style:normal}
text{text-rendering:geometricPrecision}
.rise{animation:rise 1.2s cubic-bezier(.32,.72,0,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.drift{transform-box:fill-box;transform-origin:center;animation:drift 18s cubic-bezier(.45,.05,.25,1) infinite alternate}
@keyframes drift{to{transform:translate(var(--dx),var(--dy)) scale(1.08)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s cubic-bezier(.32,.72,0,1) infinite}
@keyframes pulse{from{opacity:.6;transform:scale(1)}to{opacity:0;transform:scale(3.2)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="g0" gradientUnits="userSpaceOnUse" x1="324.652" y1="0" x2="452.21" y2="0"><stop offset="0" stop-color="#bae6fd"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>
<g class="rise" style="animation-delay:0ms"><rect x="22.5" y="40.5" width="129" height="25" rx="12.5" fill="#ffffff" fill-opacity="0.045" stroke="#ffffff" stroke-opacity="0.1"/><text x="36" y="56.6" class="mono5" font-size="10" fill="#f1f6fa" fill-opacity="0.66" style="letter-spacing:2px">SELECTED WORK</text></g><g class="rise" style="animation-delay:100ms"><text x="22" y="116"><tspan class="display" font-size="42" fill="#f1f6fa" style="letter-spacing:-1.4px">Things I've built </tspan><tspan class="italic" font-size="46.2" fill="url(#g0)">lately.</tspan></text></g><g class="rise" style="animation-delay:200ms"><text x="818" y="95" text-anchor="end" class="text" font-size="14.5" fill="#f1f6fa" fill-opacity="0.66">Open-source libraries, CLIs and apps,</text><text x="818" y="116" text-anchor="end" class="text" font-size="14.5" fill="#f1f6fa" fill-opacity="0.66">mostly Kotlin and sometimes Rust.</text></g>
</svg>
