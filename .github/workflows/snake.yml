name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs every day at 00:00 UTC
  workflow_dispatch:        # allows manual trigger from Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: yudistirosaputro
          # colours match the README cards (design/build.py: LIGHT and DARK)
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0c4a6e&color_dots=#ebedf0,#bae6fd,#7dd3fc,#0ea5e9,#0369a1
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#e0f2fe&color_dots=#161b22,#0c4a6e,#0369a1,#0ea5e9,#7dd3fc

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
